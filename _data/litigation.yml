strategic:
  - date: "August 2026"
    forum: Supreme Court of Indonesia
    case: 40 P/HUM/2026
    title: Judicial review of Government Regulation No. 71/2019 on the Operation of Electronic Systems and Transactions
    role: I am one of the counsel in the Advocacy Team for the Democratization of Indonesia's Digital Space (TAKDIR), acting for the Alliance of Independent Journalists (AJI), SAFEnet, Magdalene.co, and Project Multatuli.
    about: The petition challenges Article 95, which mandates the government to cut access to electronic content, and Article 96(a) and (b), which allow it for content that "violates the law" or "disturbs the public and public order". It argues that these provisions conflict with the Electronic Information and Transactions Law, the Press Law, the Human Rights Law, and Indonesia's ratification of the ICCPR.
    status_label: Status
    outcome: Registered at the Supreme Court on 20 August 2026; awaiting decision.
    links:
      - label: Petition (PDF, in Indonesian)
        url: /assets/pdf/2026-11-22_TAKDIR_2026_Permohonan-Uji-Materiil-PP-71-2019.pdf
      - label: LBH Pers on the registration
        url: https://lbhpers.org/uji-materi-pp-71-2019-oleh-tim-advokasi-untuk-demokratisasi-ruang-digital-indonesia-takdir-telah-teregistrasi-di-mahkamah-agung/

  - date: "July 2025 – January 2026"
    forum: Constitutional Court of Indonesia
    case: 135/PUU-XXIII/2025
    title: Judicial review of the criminal provisions of Law No. 27/2022 on Personal Data Protection
    role: I was one of the counsel for the petitioners, who included the Alliance of Independent Journalists (AJI) and SAFEnet, as part of the Civil Society Coalition for Freedom of Information and Personal Data (SIKAP).
    about: The petition challenged Articles 65(2) and 67(2), which criminalize unlawfully disclosing another person's personal data, and asked the Court to read them so that journalistic, academic, artistic, and literary work would not be caught.
    status_label: Outcome
    outcome: The Court rejected the petition in full on 19 January 2026, finding the "unlawfully" element of the offense clear enough as written.
    links:
      - label: Case tracker
        url: https://tracking.mkri.id/index.php?page=web.TrackPerkara&id=135/PUU-XXIII/2025
      - label: Revised petition (PDF, in Indonesian)
        url: https://www.mkri.id/public/filepermohonan/Perbaikan%20Permohonan_4371_8614_2025.08.25%20-%20Final%20Perbaikan%20Permohonan%20Perkara%20135%20PUU%20XXIII%202025_redacted.pdf
      - label: Decision (PDF, in Indonesian)
        url: https://www.mkri.id/public/content/persidangan/putusan/putusan_mkri_13643_1768797421.pdf

support:
  - date: "July 2026"
    forum: Constitutional Court of Indonesia
    case: 273/PUU-XXIII/2025 and 33/PUU-XXIV/2026
    title: Amicus curiae in the judicial review of Law No. 36/1999 on Telecommunications (expiring prepaid data quota)
    role: I worked on SAFEnet's amicus curiae brief, which the Court read in both cases.
    about: The petitions challenged Article 28(1) of the Telecommunications Law, as amended by the Job Creation Law, under which operators set tariffs by a government formula, because prepaid data quota that users had paid for could expire unused.
    status_label: Outcome
    outcome: On 23 July 2026 the Court partly granted case 273/PUU-XXIII/2025, holding the provision conditionally unconstitutional unless operators must offer service options that keep users' remaining quota active and usable. It declared case 33/PUU-XXIV/2026 inadmissible, as that decision had already settled the same norm.
    links:
      - label: Amicus curiae brief (PDF, in Indonesian)
        url: https://drive.proton.me/urls/FB5NMGQTA0#W4tzkQkYzwsd
      - label: Decision 273/PUU-XXIII/2025 (PDF)
        url: https://www.mkri.id/public/content/persidangan/putusan/putusan_mkri_14690_1784793855.pdf
      - label: Decision 33/PUU-XXIV/2026 (PDF)
        url: https://www.mkri.id/public/content/persidangan/putusan/putusan_mkri_14689_1784794122.pdf

  - date: "April 2026"
    forum: Rote Ndao District Court
    title: Amicus curiae for Erasmus Frans Mandato
    role: I worked on SAFEnet's amicus curiae brief, submitted to the court in April 2026.
    about: A Rote Island resident was charged under Article 28(3) with Article 45A(3) of the Electronic Information and Transactions Law after a Facebook post criticizing the closure of public roads to Oemau Beach near a luxury hotel, whose operator reported him to the police. The brief argued that there was no causal link between his post and the alleged unrest, that "false news" must be read narrowly so that opinion and criticism are not caught, and that the case was a SLAPP brought by a company against a citizen.
    status_label: Outcome
    outcome: The court acquitted him on 21 April 2026. The Supreme Court rejected the prosecution's cassation appeal on 29 October 2026 (case 12127 K/PID.SUS/2026).
    links:
      - label: Floresa on the brief
        url: https://floresa.co/reportase/mendalam/85652/2026/04/08/safenet-sebut-kriminalisasi-warga-rote-karena-kritik-via-facebook-ancam-kebebasan-berekspresi
        archive: https://web.archive.org/web/20260409022547/https://floresa.co/reportase/mendalam/85652/2026/04/08/safenet-sebut-kriminalisasi-warga-rote-karena-kritik-via-facebook-ancam-kebebasan-berekspresi
      - label: Nemberala News on the Supreme Court decision
        url: https://nemberalanews.com/mahkamah-agung-tolak-kasasi-jpu-aktivis-lingkungan-erasmus-frans-mandato-bebas-murni/

  - date: "January 2026"
    forum: Central Jakarta District Court
    case: 690/Pid.Sus/2025/PN Jkt.Pst
    title: Amicus curiae for Wawan Hermawan
    role: I worked on SAFEnet's amicus curiae brief.
    about: A student activist arrested after the August–September 2025 protests was charged over posts on a social media account that the prosecution said encouraged people to join violent actions. The brief argued that his posts were protected expression under the Constitution and the ICCPR, that the charges did not meet the elements of the offenses under the revised Electronic Information and Transactions Law, and that criminal law was being used as a first resort to silence critics.
    status_label: Outcome
    outcome: On 7 April 2026 the court sentenced him to seven months in prison, less time already served, under Article 28(3) with Article 45A(3) of the Electronic Information and Transactions Law, or Article 160 of the Criminal Code.
    links:
      - label: Amicus curiae brief (PDF, in Indonesian)
        url: https://drive.proton.me/urls/T28AP8QZ6G#gMY0v4o7ljJ6
      - label: SAFEnet on the brief
        url: https://safenet.or.id/amicus-curiae-untuk-kasus-wawan-hermawan/
      - label: Amnesty International Indonesia on the verdict
        url: https://www.amnesty.id/kabar-terbaru/siaran-pers/vonis-peradilan-sesat-wawan-hermawan/04/2026/
        archive: https://web.archive.org/web/20260407215810/https://www.amnesty.id/kabar-terbaru/siaran-pers/vonis-peradilan-sesat-wawan-hermawan/04/2026/

  - date: "December 2025"
    forum: South Jakarta District Court
    title: Amicus curiae for Laras Faizati
    role: I was part of the team that wrote SAFEnet's amicus curiae brief, which Rama, SAFEnet's representative, presented to the court on 11 December 2025.
    about: Laras Faizati was charged with incitement over social media posts written after the death of Affan Kurniawan during the August 2025 protests. Four amici curiae, including SAFEnet, asked the court to read the digital evidence as a whole and to protect citizens' freedom of expression.
    status_label: Outcome
    outcome: On 15 January 2026 the court found her guilty and sentenced her to six months in prison, suspended on condition that she commit no offense for one year.
    links:
      - label: Tempo on the amicus curiae briefs
        url: https://www.tempo.co/hukum/4-amicus-curiae-untuk-laras-faizati-tuntut-pembebasan-2098550
