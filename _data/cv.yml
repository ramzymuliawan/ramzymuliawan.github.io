cv:
  name: Ramzy Muliawan
  label: Senior Trust & Safety Policy Manager, Wikimedia Foundation
  email: ramzymuliawan@protonmail.ch
  location: Jakarta, Indonesia
  summary: A legal professional with experiences in community facilitation, cross-cultural engagement, digital and civic society development, and public policy advocacy. Strong educational background in international economic and human rights law. Interested in exploring and specializing in the intersection between free knowledge, public policy, and governance of digital communities.

