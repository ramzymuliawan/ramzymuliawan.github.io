cv:
  name: Ramzy Muliawan
  label: Senior Trust & Safety Policy Manager, Wikimedia Foundation
  email: ramzymuliawan@protonmail.ch
  location: Jakarta, Indonesia
  summary: A legal professional with experiences in community facilitation, cross-cultural engagement, digital and civic society development, and public policy advocacy. Strong educational background in international economic and human rights law. Interested in exploring and specializing in the intersection between free knowledge, public policy, and governance of digital communities.

  social_networks:
    - network: LinkedIn
      username: ramzym

  sections:
    Education:
      - institution: Monash University
        location: Jakarta
        area: Policy Studies stream
        studyType: Master of Public Policy and Management (M.P.P.M.)
        start_date: 2023
        end_date: 2025
        highlights:
          - Monash University Indonesia's Scholarship and Australia Leadership Program awardee.
          - "Coursework: Foundations of Public Policy, Public Sector Reform, Digital Technology and Public Policy, Implementation and Service Delivery, Policy Analysis, Evaluation, Advanced Research Project."

      - institution: Universitas Andalas
        location: Padang
        area: International Law, Cum Laude
        studyType: Bachelor of Law (S.H.)
        start_date: 2018
        end_date: 2022
        highlights:
          - "GPA: 3.79/4.00."
          - "Coursework: Public International Law, Private International Law, Intellectual Property Law, International Economic Law."

      - institution: Justus-Liebig-Universität Gießen & University of Wisconsin School of Law
        location: Gießen (remote)
        studyType: U.S.-German Summer Law School
        start_date: 2020-07
        end_date: 2020-07
        highlights:
          - "Coursework: International Human Rights Law (2 ECTS) & International Humanitarian Law (2 ECTS)."

    Experience:
      - company: Wikimedia Foundation
        position: Senior Trust & Safety Policy Manager
        location: San Francisco (remote)
        start_date: 2025-10
        highlights:
          - Responsible for reviewing, enhancing, and developing trust and safety policies which guide the Foundation and its volunteers to ensure that those policies reflect the Wikimedia movement's values, meet community needs, and strengthen the Foundation's commitment to transparency, fairness, and inclusivity.
          - Supporting the development of Universal Code of Conduct (UCoC) ecosystem across Wikimedia's global, multilingual communities, in collaboration with the UCoC Coordinating Committee (U4C) and partner with multiple language-based project communities in their own review and improvement of UCoC adherence.
          - "Tools: Asana, MediaWiki, Slack, Discord, Microsoft Office, Google Workspace, Zoom, Jitsi."

      - company: Southeast Asia Freedom of Expression Network (SAFEnet)
        position: Legal Counsel, Pro Bono
        location: Denpasar (remote)
        start_date: 2025-06
        highlights:
          - Part of SAFEnet's informal coalition of attorneys focusing on the violation of human rights in online spaces.
          - Part of an advocacy team for the Civil Society Coalition for Freedom of Information and Personal Data (SIKAP), a coalition of civil society organizations and individuals that challenged the criminal provisions of the Indonesian Personal Data Protection Law (2025-26).
          - Part of the Advocacy Team for the Democratization of Indonesia's Digital Space (TAKDIR), a coalition of civil society organizations that challenged the government power to order content takedowns under the provisions of Government Regulation 71/2019 on the Operation of Electronic Systems and Transactions (2026).

      - company: Wikimedia Foundation
        position: Committee Support Specialist
        location: San Francisco (remote)
        start_date: 2023-07
        end_date: 2025-10
        highlights:
          - Provided strategic and operational support in the service of helping multiple key Wikimedia volunteer governance committees to reach their best potential in a framework that supports the time and energy of the volunteers involved.
          - "Tools: Asana, MediaWiki, Slack, Discord, Microsoft Office, Google Workspace, Zoom, Jitsi."

      - company: Wikimedia Foundation
        position: Community Facilitator
        location: San Francisco (remote)
        start_date: 2021-01
        end_date: 2023-08
        highlights:
          - Engaged and supported the participation of Indonesian-speaking Wikimedia project communities and organizations in the drafting of the Enforcement Guidelines for Universal Code of Conduct, a universal minimum set of guidelines of expected and unacceptable behavior in Wikimedia projects and spaces, as well as participation of the Wikimedia volunteer communities in Asia-Pacific in the multiple programs and initiatives to implement Movement Strategy 2030, a multi-year collaborative effort to imagine and build the future of the Wikimedia movement.
          - "Projects: Wikimedia Foundation Board of Trustees election; Wikimedia Foundation Annual Plan community consultations; Wikimedia Foundation Terms of Use update; Wikimedia Summit 2022; Universal Code of Conduct community consultations; Movement Strategy Implementation Grants; East, Southeast Asia, and the Pacific (ESEAP) Hub project; and others."
          - "Tools: Asana, MediaWiki, Slack, Discord, Microsoft Office, Google Workspace, Zoom, Jitsi."

